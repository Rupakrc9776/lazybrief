[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazybrief"
version = "0.1.0"
description = "A local-first text brief generator using Ollama and open-weight models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31,<3",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
